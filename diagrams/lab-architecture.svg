  <rect x="396" y="128" width="518" height="176" rx="8" fill="#FFFFFF" stroke="#2C6FBB" stroke-dasharray="6 4"/>
  <text x="410" y="148" font-size="12" fill="#555">VMware Workstation Pro</text>

  <rect x="416" y="160" width="214" height="124" rx="8" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="2" stroke-dasharray="7 4"/>
