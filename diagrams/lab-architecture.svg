  <text x="485" y="419" font-size="12" fill="#555" text-anchor="middle">VMware LAN segment + direct link between hosts · no route to the home network · IP plan to be set</text>

  <!-- Analyst -->
  <rect x="700" y="470" width="204" height="70" rx="8" fill="#FFF2CC" stroke="#D6B656" stroke-width="2"/>
