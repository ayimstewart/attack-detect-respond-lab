  <text x="190" y="230" font-size="12" fill="#333" text-anchor="middle">4 vCPU · 4 GB RAM · 64 GB</text>
  <text x="190" y="262" font-size="12" font-weight="700" fill="#3D7A3A" text-anchor="middle">● Installed</text>

