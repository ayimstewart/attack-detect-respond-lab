  <text x="663" y="212" font-size="11" font-weight="700" fill="#2C6FBB" text-anchor="middle">logs</text>

  <polyline points="894,222 950,222 950,505 904,505" fill="none" stroke="#3D7A3A" stroke-width="2.5" marker-end="url(#aGreen)"/>
  <rect x="952" y="350" width="22" height="70" fill="#FFFFFF"/>
  <text x="963" y="385" font-size="11" font-weight="700" fill="#3D7A3A" text-anchor="middle" transform="rotate(90 963 385)">alerts</text>

