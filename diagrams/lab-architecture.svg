  <line x1="190" y1="320" x2="190" y2="372" stroke="#666" stroke-width="2" stroke-dasharray="2 4"/>
  <line x1="523" y1="320" x2="523" y2="372" stroke="#666" stroke-width="2" stroke-dasharray="2 4"/>
  <line x1="797" y1="320" x2="797" y2="372" stroke="#666" stroke-width="2" stroke-dasharray="2 4"/>
